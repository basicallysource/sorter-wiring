name: Harness drawings

# Regenerates static/harness/ from the WireViz sources whenever they change,
# and commits the result back to the branch. The point is that a PR editing
# wireviz/power.yml is a complete change on its own: the drawing, the BOM,
# the PDF and the supplier zip catch up here, so nobody needs WireViz and
# graphviz installed to contribute one, and the Vercel preview shows the real
# rendered drawing rather than the previous one.
#
# static/harness/** is in the path filters on purpose. Those files are
# derived, so a hand-edit to one is a mistake by definition, and including
# them here is what turns it back. This cannot loop: a push made with
# GITHUB_TOKEN does not start another workflow run, and a run over an
# already-current tree produces no commit anyway.
#
# scripts/build-harness.sh is the whole build and is meant to be run locally
# too. Everything about reproducibility lives in its comments, not here.

on:
  pull_request:
    paths:
      - 'wireviz/**'
      - 'static/harness/**'
      - 'scripts/build-harness.sh'
      - '.github/workflows/harness.yml'
  push:
    branches: [main]
    paths:
      - 'wireviz/**'
      - 'static/harness/**'
      - 'scripts/build-harness.sh'
      - '.github/workflows/harness.yml'
  workflow_dispatch:

# Nothing here reads a secret. contents: write is the regenerated commit,
# pull-requests: write is the one comment below.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: harness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # On a pull_request the default checkout is the merge commit, which
          # is not a branch and cannot be pushed to. Take the head branch.
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned: WireViz stamps its own version into every .gv and .html, so a
      # bump rewrites all of them at once. Do that deliberately, not by drift.
      - run: pip install wireviz==0.4.1

      # Pinned for the same reason as WireViz, and it matters more here: the
      # graphviz version IS part of the rendered output, so an unpinned bump
      # silently rewrites every PNG, SVG and HTML at once. CI is the canonical
      # renderer -- a local run on a different graphviz will produce different
      # images, and this job will normalise them back on the next push.
      - run: |
          sudo apt-get update
          sudo apt-get install -y graphviz=2.42.2-9ubuntu0.1
          dot -V

      - run: ./scripts/build-harness.sh

      - id: changed
        run: |
          if git diff --quiet -- static/harness; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "static/harness is already current"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- static/harness
          fi

      # A fork's GITHUB_TOKEN is read-only, so there is nothing to push to and
      # the honest outcome is a red check naming the command to run, rather
      # than a green one over drawings that do not match their source.
      - name: Fork PR cannot be updated in place
        if: steps.changed.outputs.dirty == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::static/harness is out of date. Run ./scripts/build-harness.sh and commit the result."
          exit 1

      - name: Commit regenerated drawings
        if: steps.changed.outputs.dirty == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/harness
          git commit -m "Regenerate harness drawings from wireviz/"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}

      # Reviewing a harness change means looking at the drawing, and the drawing
      # is a binary in a diff. So the PR gets one comment, edited in place rather
      # than re-posted, pointing at this branch's rendered copies.
      #
      # Two kinds of link on purpose. The Vercel branch preview is the nice one
      # -- the actual page, with all three drawings and the downloads -- but it
      # is a URL derived from the branch name rather than one Vercel told us, so
      # a long or unusually punctuated branch can land somewhere that 404s. The
      # per-file links underneath are built from the commit SHA and are always
      # right, which is why they are there even though they are uglier.
      - name: Point the PR at the rendered drawings
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)

          # Vercel's branch-preview host: lowercase, non-alphanumerics to dashes.
          SLUG=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')
          PREVIEW="https://sorter-wiring-git-${SLUG}-spencer-huberts-projects.vercel.app/wireviz"

          {
            echo '<!-- harness-drawings -->'
            echo '### Harness drawings for this PR'
            echo
            echo "**[Open the WireViz page on the preview build]($PREVIEW)** — all three drawings, BOMs and the supplier zip, rendered."
            echo
            echo "Rendered from \`wireviz/\` at \`${SHA:0:7}\`. If that link 404s, the branch name did not map to the host Vercel used — use Vercel's own comment on this PR, or these, which are built from the commit and cannot be wrong:"
            echo
            echo '| Drawing | | | |'
            echo '|---|---|---|---|'
            for d in power steppers leds; do
              B="https://github.com/$REPO/blob/$SHA/static/harness/$d"
              echo "| \`$d\` | [PNG]($B.png) | [PDF]($B.pdf) | [BOM]($B.bom.tsv) |"
            done
            echo
            echo "_Regenerated by \`harness.yml\`. Edit \`wireviz/*.yml\`, never \`static/harness/\` — anything committed there by hand is overwritten on the next run._"
          } > comment.md

          ID=$(gh api "repos/$REPO/issues/$PR/comments" --jq '[.[] | select(.body | startswith("<!-- harness-drawings -->"))] | first | .id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md >/dev/null
            echo "updated comment $ID"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
            echo "posted new comment"
          fi
          rm -f comment.md
